name: Nightly Backup

# Backs up production every night, so a quiet week still has a recent restore point (deploy.yml
# only backs up when something merges). Runs the same workflow as every deploy. A failed run emails the repository owner. Start one by hand from
# Actions > Nightly Backup > Run workflow.
#
# It skips itself while a deploy or hotfix is running or queued: a deploy takes its own backup
# before it migrates. And deploy.yml and hotfix.yml wait for a running nightly backup before they migrate, so a dump is
# never taken across a migration. Neither shares the production-deploy concurrency group, because
# a queued nightly would replace a queued deploy there.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Skip while a deploy or hotfix runs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      deploying: ${{ steps.check.outputs.deploying }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          busy=0
          for workflow in deploy.yml hotfix.yml; do
            for status in queued in_progress waiting pending requested; do
              count=$(gh run list --workflow "$workflow" --status "$status" --json databaseId --jq length)
              busy=$((busy + count))
            done
          done
          if [ "$busy" -gt 0 ]; then
            echo "::notice::A deploy or hotfix is running or queued. It takes its own backup, so tonight's run is skipped."
            echo "deploying=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploying=false" >> "$GITHUB_OUTPUT"
          fi

  backup:
    name: Nightly Backup
    needs: guard
    if: needs.guard.outputs.deploying == 'false'
    uses: ./.github/workflows/database-backup.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
