name: Onboarding Eval

# Live onboarding plan evaluation with 13 synthetic athletes. On demand only and
# not a required check. Run it before setting ONBOARDING_PLAN_MODEL_EVALUATED=true
# for a provider or model: add the `onboarding-eval` label to a pull request or
# use Run workflow on main.
#
# route=router (the default) sends the requests through the OpenAI-compatible
# router in the `EVAL_BASE_URL` variable with `EVAL_API_KEY`; the owner keeps
# provider credits for production, so evals run there (use the router's model
# id, e.g. deepseek-v4-flash). The router ignores thinking-off and adds its own
# timeouts, so it cannot prove the exact production request; the first
# production plans are checked through the onboarding.plan.generated audit
# metadata. route=direct calls the provider with its repository secret
# (`DEEPSEEK_API_KEY`, `GROQ_API_KEY`, `GEMINI_API_KEY`) and gates p95 latency.
# thinking matches ONBOARDING_PLAN_THINKING. Each run makes 12 to 24 calls (one
# repair at most per athlete).
on:
  workflow_dispatch:
    inputs:
      provider:
        description: deepseek, groq or gemini
        required: false
        default: deepseek
      model:
        description: Model id (empty = deepseek-v4-flash on the router, deepseek-flash direct)
        required: false
        default: ""
      route:
        description: router (EVAL_BASE_URL) or direct (provider key secret)
        required: false
        default: router
        type: choice
        options: [router, direct]
      thinking:
        description: on or off, as ONBOARDING_PLAN_THINKING
        required: false
        default: "on"
        type: choice
        options: ["on", "off"]
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: onboarding-eval
  cancel-in-progress: false

jobs:
  onboarding-eval:
    name: Onboarding plan live evaluation
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'onboarding-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.0"

      - name: Run live evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ inputs.route != 'direct' && vars.EVAL_BASE_URL || '' }}
          EVAL_THINKING: ${{ inputs.thinking || 'on' }}
          EVAL_PROVIDER: ${{ inputs.provider || 'deepseek' }}
          EVAL_MODEL: ${{ inputs.model || (inputs.route != 'direct' && 'deepseek-v4-flash' || 'deepseek-flash') }}
          EVAL_REPORT_DIR: eval-report
        run: |
          hosts="api.deepseek.com,api.groq.com,generativelanguage.googleapis.com"
          if [ -n "$EVAL_BASE_URL" ]; then
            hosts="$hosts,$(printf '%s' "$EVAL_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          fi
          deno run --allow-env --allow-net="$hosts" --allow-write \
            supabase/functions/_evals/onboarding_plan_eval.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onboarding-eval-report
          path: eval-report
          retention-days: 30
