name: Coach Eval

# The live Coach model evaluations. Not a required check, and on demand only: Actions > Coach Eval >
# Run workflow, choosing the branch to evaluate (a pull request's branch before it merges, or main).
# Starting it needs write access to the repository, so the owner is the only one who can; a pull
# request event never starts it, and a fork's pull request never receives these credentials
# (scripts/check-workflow-credentials.sh, run in ci.yml, fails any workflow that an untrusted event
# can start and that mentions them). To run the bank on your own machine instead, use the
# AI_COACH_CHAT_* settings (live_model.ts). Every Coach change must pass the answer bank
# (docs/TESTING_STRATEGY.md).
#
# Three parts:
#   - Answer bank (supabase/functions/_evals/coach_bank/): about 100 synthetic athletes, each run
#     3 times against the real model, graded by code. Safety categories allow zero failures; the
#     others report a pass rate against a threshold. Its deterministic half (graders, red-flag
#     cases, good and bad replies) already runs in the Deno job of ci.yml on every pull request.
#   - Operations (coach_chat_eval.ts): about 54 prompts x 3 athletes for model-answer rate,
#     dead ends, latency, spend and the prompt cache. Each run makes 17 calls unless `max_calls`
#     or the `EVAL_MAX_CALLS` variable says otherwise: one prompt from each category, rotating
#     prompts and athletes; "all" runs every prompt for every athlete.
#   - Simulated athletes (supabase/functions/_evals/coach_sim/, Run workflow with `simulate`, which
#     runs only them): four personas with months of synthetic records talk to Coach for 2-3
#     messages (default 3, fitted to the cap so every conversation runs) in eight scenarios (a
#     bench plateau and a programme change, a cut, a travel week, "what did I do last Tuesday", a
#     knee that feels off, a supplement and its research, a follow-up, pushback). Each turn is
#     graded by code, an expert-coach judge and, for cited research, a claim-support judge, on a
#     model other than the Coach's. Report only: the job fails on a harness error, never on
#     quality. A harness error is a failed preflight (one tiny request to each model in the mode
#     the run uses), more than 20% of Coach turns ending in a provider error, a judge with no
#     verdicts, or an athlete model that cannot continue. `sim_filter` picks conversations
#     ("primary", "knee-off", "primary/bench-plateau"); `sim_max_turns` caps the messages (the run
#     lowers it, and then how many replies are judged, until the estimate fits 85% of
#     `EVAL_SIM_MAX_USD`, repository variable, default 3; it prints the estimate first and stops at
#     the cap). Here it runs on the eval router only; the production Coach model is used when the
#     router lists it, else Sonnet 5.5 plays and the report says so. To run it on the production
#     Claude route, run coach_sim/run.ts locally without EVAL_BASE_URL, with the AI_COACH_CHAT_*
#     settings and ANTHROPIC_API_KEY (docs/reviews/2026-10-31-coach-simulation.md, Reproduce).
#   The library retrieval evaluation (no model, no spend) is library-eval.yml.
#
# The model is called as before: by default DeepSeek (`DEEPSEEK_API_KEY` secret). Set the
# repository variable `EVAL_BASE_URL` (for example https://router.bynara.id/v1) and the
# `EVAL_API_KEY` secret to send the same requests through an OpenAI-compatible router instead;
# `EVAL_MODEL` overrides the model name. A router run is a smoke test: each attempt may wait up
# to 120 s and latency is reported, not gated, because it is not production latency. To run the
# bank on the Claude route Coach uses in production, run it locally with the AI_COACH_CHAT_*
# settings and ANTHROPIC_API_KEY (live_model.ts); no Anthropic key is stored in this repository.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: Calls the operations evaluation makes (one prompt per category, rotating), or "all"
        required: false
        default: "17"
      repeats:
        description: Runs per prompt and athlete when max_calls is "all"
        required: false
        default: "2"
      bank_repeats:
        description: Runs of each answer bank case that reaches a model
        required: false
        default: "3"
      bank_cases:
        description: Comma-separated parts of case ids to run (empty runs the whole bank)
        required: false
        default: ""
      simulate:
        description: Run only the simulated-athlete conversations (report only, eval router)
        type: boolean
        required: false
        default: false
      sim_filter:
        description: Comma-separated parts of conversation ids, personas or scenarios (empty runs all)
        required: false
        default: ""
      sim_coach_model:
        description: Router model id that plays the Coach in the simulator (empty uses the production model, else the EVAL_SIM_COACH_MODEL variable)
        required: false
        default: ""
      sim_max_turns:
        description: Athlete messages per simulated conversation at most (1-10; the run may lower it to fit the cap)
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  coach-eval:
    name: Coach chat live evaluation
    if: ${{ !inputs.simulate }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: coach-eval
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.0"

      - name: Run the answer bank
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_REPEATS: ${{ inputs.bank_repeats || '3' }}
          EVAL_CASES: ${{ inputs.bank_cases }}
          EVAL_REPORT_DIR: eval-report/bank
        run: |
          hosts="api.deepseek.com"
          if [ -n "$EVAL_BASE_URL" ]; then
            hosts="$hosts,$(printf '%s' "$EVAL_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          fi
          deno run --allow-env --allow-net="$hosts" --allow-read --allow-write \
            supabase/functions/_evals/coach_bank/run.ts

      - name: Run the operations evaluation
        if: ${{ !cancelled() }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_MAX_CALLS: ${{ inputs.max_calls || vars.EVAL_MAX_CALLS || '17' }}
          EVAL_REPEATS: ${{ inputs.repeats || '2' }}
          EVAL_REPORT_DIR: eval-report/operations
        run: |
          hosts="api.deepseek.com"
          if [ -n "$EVAL_BASE_URL" ]; then
            hosts="$hosts,$(printf '%s' "$EVAL_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          fi
          deno run --allow-env --allow-net="$hosts" --allow-read --allow-write \
            supabase/functions/_evals/coach_chat_eval.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coach-eval-report
          path: eval-report
          retention-days: 30

  coach-simulator:
    name: Coach simulated athletes
    if: ${{ inputs.simulate }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.0"

      - name: Run the simulated athletes
        env:
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_COACH_MODEL: ${{ inputs.sim_coach_model || vars.EVAL_SIM_COACH_MODEL }}
          EVAL_ATHLETE_MODEL: ${{ vars.EVAL_SIM_ATHLETE_MODEL }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_SIM_JUDGE_MODEL }}
          EVAL_MAX_USD: ${{ vars.EVAL_SIM_MAX_USD || '3' }}
          EVAL_SIM_FILTER: ${{ inputs.sim_filter }}
          EVAL_SIM_MAX_TURNS: ${{ inputs.sim_max_turns || '3' }}
          EVAL_REPORT_DIR: sim-report
        run: |
          if [ -z "$EVAL_BASE_URL" ]; then
            echo '::error::The simulator runs only on the eval router here: set the EVAL_BASE_URL variable.'
            exit 2
          fi
          host=$(printf '%s' "$EVAL_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')
          deno run --allow-env --allow-net="$host" --allow-read --allow-write \
            supabase/functions/_evals/coach_sim/run.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coach-simulation-report
          path: sim-report
          retention-days: 30
