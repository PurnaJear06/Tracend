name: Coach Eval

# The live Coach evaluations. On demand only and not a required check. Before merging a Coach
# change, add the `coach-eval` label to the pull request (runs that PR's code) or use Run
# workflow on main. Every Coach pull request must pass the answer bank (docs/TESTING_STRATEGY.md).
#
# Three parts:
#   - Answer bank (supabase/functions/_evals/coach_bank/): about 100 synthetic athletes, each run
#     3 times against the real model, graded by code. Safety categories allow zero failures; the
#     others report a pass rate against a threshold. Its deterministic half (graders, red-flag
#     cases, good and bad replies) already runs in the Deno job of ci.yml on every pull request.
#   - Operations (coach_chat_eval.ts): about 54 prompts x 3 athletes for model-answer rate,
#     dead ends, latency, spend and the prompt cache. Each run makes 17 calls unless `max_calls`
#     or the `EVAL_MAX_CALLS` variable says otherwise: one prompt from each category, rotating
#     prompts and athletes; "all" runs every prompt for every athlete.
#   - Library retrieval (library_eval.ts, E3's gate): the 92 questions (follow-ups included) through
#     the real hybrid search, search_library_v2, on a local Supabase stack with the real gte-small
#     embeddings, scored as recall@8 and MRR; the run fails when mean recall in the top 8 is under
#     0.8 or a regional source reaches an athlete outside its region. It needs the database and the
#     embedding model, so it cannot run in the Deno job. Run it alone with `retrieval_only`.
#
#   - Simulated athletes (supabase/functions/_evals/coach_sim/, Run workflow with `simulate`):
#     four personas with months of synthetic records talk to Coach for 2-3 messages (default 3,
#     fitted to the cap so every conversation runs) in eight
#     scenarios (a bench plateau and a programme change, a cut, a travel week, "what did I do last
#     Tuesday", a knee that feels off, a supplement and its research, a follow-up, pushback). Each
#     turn is graded by code, an expert-coach judge and, for cited research, a claim-support
#     judge, on a model other than the Coach's. Report only: the job fails on a harness error,
#     never on quality. A harness error is a failed preflight (one tiny request to each model in
#     the mode the run uses; JSON mode without response_format and the other model spellings are
#     tried first), more than 20% of Coach turns ending in a provider error, a judge with no
#     verdicts, or an athlete model that cannot continue. Every failed call records its HTTP status
#     and the first 300 characters of its body, redacted, in simulation.json. It never runs on a
#     pull request. `sim_filter` picks conversations
#     ("primary", "knee-off", "primary/bench-plateau"); `sim_max_turns` caps the messages (the
#     run lowers it, and then how many replies are judged, until the estimate fits 85% of
#     `EVAL_SIM_MAX_USD`, repository variable, default 3; it prints the estimate first and stops at
#     the cap). When the production Coach model has no working request at the router, Sonnet 5.5
#     plays instead and the report says so. Optional variables: `EVAL_SIM_COACH_MODEL`, `EVAL_SIM_ATHLETE_MODEL`,
#     `EVAL_SIM_JUDGE_MODEL` (router model ids).
#
# Models: the repository variable `EVAL_BASE_URL` (for example https://router.bynara.id/v1) and
# the `EVAL_API_KEY` secret are the eval router. With them the bank and the simulator run the
# production gateway path over the router (live_model.ts, routerGatewayFromEnv), so lookups,
# proposals and the library cases run too; the Coach is the production model
# (`claude-haiku-5-5`) when the router lists it, else `EVAL_MODEL` or DeepSeek V4 Flash, and the
# report says which. Without a router the bank and the operations evaluation call DeepSeek
# directly (`DEEPSEEK_API_KEY` secret). A router run is a smoke test: each attempt may wait up to
# 120 s and latency is reported, not gated, because it is not production latency. No Anthropic
# key is stored in this repository.
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: Calls the operations evaluation makes (one prompt per category, rotating), or "all"
        required: false
        default: "17"
      repeats:
        description: Runs per prompt and athlete when max_calls is "all"
        required: false
        default: "2"
      bank_repeats:
        description: Runs of each answer bank case that reaches a model
        required: false
        default: "3"
      bank_cases:
        description: Comma-separated parts of case ids to run (empty runs the whole bank)
        required: false
        default: ""
      retrieval_only:
        description: Run only the library retrieval evaluation (no model, no spend)
        type: boolean
        required: false
        default: false
      simulate:
        description: Run only the simulated-athlete conversations (report only, eval router)
        type: boolean
        required: false
        default: false
      sim_filter:
        description: Comma-separated parts of conversation ids, personas or scenarios (empty runs all)
        required: false
        default: ""
      sim_coach_model:
        description: Router model id that plays the Coach in the simulator (empty uses the production model, else the EVAL_SIM_COACH_MODEL variable)
        required: false
        default: ""
      sim_max_turns:
        description: Athlete messages per simulated conversation at most (1-10; the run may lower it to fit the cap)
        required: false
        default: "3"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: coach-eval
  cancel-in-progress: false

jobs:
  coach-eval:
    name: Coach chat live evaluation
    if: (github.event_name == 'workflow_dispatch' && !inputs.retrieval_only && !inputs.simulate) || github.event.label.name == 'coach-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.0"

      - name: Run the answer bank
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_REPEATS: ${{ inputs.bank_repeats || '3' }}
          EVAL_CASES: ${{ inputs.bank_cases }}
          EVAL_REPORT_DIR: eval-report/bank
        run: |
          hosts="api.deepseek.com"
          if [ -n "$EVAL_BASE_URL" ]; then
            hosts="$hosts,$(printf '%s' "$EVAL_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          fi
          deno run --allow-env --allow-net="$hosts" --allow-read --allow-write \
            supabase/functions/_evals/coach_bank/run.ts

      - name: Run the operations evaluation
        if: ${{ !cancelled() }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_MAX_CALLS: ${{ inputs.max_calls || vars.EVAL_MAX_CALLS || '17' }}
          EVAL_REPEATS: ${{ inputs.repeats || '2' }}
          EVAL_REPORT_DIR: eval-report/operations
        run: |
          hosts="api.deepseek.com"
          if [ -n "$EVAL_BASE_URL" ]; then
            hosts="$hosts,$(printf '%s' "$EVAL_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          fi
          deno run --allow-env --allow-net="$hosts" --allow-read --allow-write \
            supabase/functions/_evals/coach_chat_eval.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coach-eval-report
          path: eval-report
          retention-days: 30

  library-retrieval:
    name: Library retrieval evaluation
    if: (github.event_name == 'workflow_dispatch' && !inputs.simulate) || github.event.label.name == 'coach-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.0"

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: "2.101.0"

      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Start the local Supabase stack with every migration
        run: |
          supabase start
          supabase db reset

      - name: Serve the embedding function
        run: |
          supabase functions serve --no-verify-jwt > functions.log 2>&1 &
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:54321/functions/v1/library-embed \
              -H 'Content-Type: application/json' -d '{}' || true)
            if [ "$code" = 401 ] || [ "$code" = 403 ]; then exit 0; fi
            sleep 5
          done
          cat functions.log
          echo '::error::library-embed did not start.'
          exit 1

      - name: Embed every chunk with the real model
        run: |
          secret=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -tA \
            -c 'select private.library_worker_secret()')
          key=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"/\1/p')
          echo "::add-mask::$secret"
          echo "::add-mask::$key"
          echo "EVAL_WORKER_SECRET=$secret" >> "$GITHUB_ENV"
          echo "EVAL_SERVICE_KEY=$key" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            curl -sS -X POST http://127.0.0.1:54321/functions/v1/library-embed \
              -H "Authorization: Bearer $secret" -H 'Content-Type: application/json' \
              -d '{}' > /dev/null || true
            status=$(curl -sS -X POST http://127.0.0.1:54321/rest/v1/rpc/library_status_v1 \
              -H "apikey: $key" -H "Authorization: Bearer $key" \
              -H 'Content-Type: application/json' -d '{}')
            echo "$status"
            chunks=$(printf '%s' "$status" | jq '.chunks')
            embedded=$(printf '%s' "$status" | jq '.embedded_chunks')
            if [ "$chunks" -gt 0 ] && [ "$chunks" = "$embedded" ]; then exit 0; fi
            sleep 5
          done
          echo '::error::Not every chunk was embedded.'
          exit 1

      - name: Run the retrieval evaluation
        run: |
          deno run --allow-env --allow-net=127.0.0.1 --allow-read=supabase/functions/_evals \
            supabase/functions/_evals/library_eval.ts | tee retrieval-report.txt
          cat retrieval-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-retrieval-report
          path: retrieval-report.txt
          retention-days: 30

  coach-simulator:
    name: Coach simulated athletes
    if: github.event_name == 'workflow_dispatch' && inputs.simulate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.0"

      - name: Run the simulated athletes
        env:
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_COACH_MODEL: ${{ inputs.sim_coach_model || vars.EVAL_SIM_COACH_MODEL }}
          EVAL_ATHLETE_MODEL: ${{ vars.EVAL_SIM_ATHLETE_MODEL }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_SIM_JUDGE_MODEL }}
          EVAL_MAX_USD: ${{ vars.EVAL_SIM_MAX_USD || '3' }}
          EVAL_SIM_FILTER: ${{ inputs.sim_filter }}
          EVAL_SIM_MAX_TURNS: ${{ inputs.sim_max_turns || '3' }}
          EVAL_REPORT_DIR: sim-report
        run: |
          if [ -z "$EVAL_BASE_URL" ]; then
            echo '::error::The simulator runs only on the eval router: set the EVAL_BASE_URL variable.'
            exit 2
          fi
          host=$(printf '%s' "$EVAL_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')
          deno run --allow-env --allow-net="$host" --allow-read --allow-write \
            supabase/functions/_evals/coach_sim/run.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coach-simulation-report
          path: sim-report
          retention-days: 30
