name: Coach Eval

# Live Coach chat evaluation against the real DeepSeek model with synthetic
# athletes. On demand only: it costs about $1 per run and is not a required
# check. Before merging a Coach chat change, add the `coach-eval` label to the
# pull request (runs that PR's code) or use Run workflow on main.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Runs per prompt and athlete
        required: false
        default: "2"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: coach-eval
  cancel-in-progress: false

jobs:
  coach-eval:
    name: Coach chat live evaluation
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'coach-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.0"

      - name: Run live evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_REPEATS: ${{ inputs.repeats || '2' }}
          EVAL_REPORT_DIR: eval-report
        run: >
          deno run --allow-env --allow-net=api.deepseek.com --allow-read --allow-write
          supabase/functions/_evals/coach_chat_eval.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-eval-report
          path: eval-report
          retention-days: 30
