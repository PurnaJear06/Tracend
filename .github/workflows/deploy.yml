name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci-gate:
    name: Mandatory CI Gate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm successful main CI run
        run: |
          echo "CI run ${{ github.event.workflow_run.html_url }} passed."
          echo "Deploying exact commit ${{ github.event.workflow_run.head_sha }}."

  dry-run:
    name: Migration Dry-Run
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: "2.101.0"

      - name: Dry-run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          supabase db push --linked --dry-run

  backup:
    name: Backup + Isolated Restore Drill
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Dump production schema + data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          TIMESTAMP=$(date -u +%Y-%m-%dT%H%M%S)
          echo "BACKUP_STAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          supabase db dump --linked --role-only -f "backup-${TIMESTAMP}-roles.sql"
          supabase db dump --linked -f "backup-${TIMESTAMP}-schema.sql"
          supabase db dump --linked --data-only --use-copy -f "backup-${TIMESTAMP}-data.sql"

      - name: Verify backup integrity
        run: |
          for file in \
            "backup-${BACKUP_STAMP}-roles.sql" \
            "backup-${BACKUP_STAMP}-schema.sql" \
            "backup-${BACKUP_STAMP}-data.sql"; do
            test -s "$file" || {
              echo "::error::Backup is missing or empty: $file"
              exit 1
            }
          done
          sha256sum backup-*.sql > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Start isolated restore target
        run: supabase start

      - name: Restore schema + data into isolated database
        run: |
          DB_CONTAINER=$(docker ps \
            --filter 'name=supabase_db_' \
            --format '{{.Names}}' | head -1)
          test -n "$DB_CONTAINER" || {
            echo "::error::Isolated Supabase database container was not found."
            exit 1
          }

          docker exec "$DB_CONTAINER" psql \
            --username postgres \
            --dbname postgres \
            --variable ON_ERROR_STOP=1 \
            --command 'DROP SCHEMA public CASCADE' \
            --command 'CREATE SCHEMA public' \
            --command 'GRANT ALL ON SCHEMA public TO postgres, anon, authenticated, service_role'

          docker cp "backup-${BACKUP_STAMP}-schema.sql" "$DB_CONTAINER:/tmp/schema.sql"
          docker cp "backup-${BACKUP_STAMP}-data.sql" "$DB_CONTAINER:/tmp/data.sql"
          docker exec "$DB_CONTAINER" psql \
            --username postgres \
            --dbname postgres \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file /tmp/schema.sql \
            --command 'SET session_replication_role = replica' \
            --file /tmp/data.sql

          TABLE_COUNT=$(docker exec "$DB_CONTAINER" psql \
            --username postgres \
            --dbname postgres \
            --tuples-only \
            --no-align \
            --command "select count(*) from pg_tables where schemaname = 'public'" | tr -d '[:space:]')
          test "${TABLE_COUNT:-0}" -gt 0 || {
            echo "::error::Restore drill produced no public tables."
            exit 1
          }
          echo "Restore drill passed with $TABLE_COUNT public tables."

      - name: Encrypt verified backup artifact
        env:
          BACKUP_ARCHIVE_PASSPHRASE: ${{ secrets.BACKUP_ARCHIVE_PASSPHRASE }}
        run: |
          test -n "$BACKUP_ARCHIVE_PASSPHRASE" || {
            echo "::error::BACKUP_ARCHIVE_PASSPHRASE is not configured."
            exit 1
          }
          ARCHIVE="database-backup-${BACKUP_STAMP}.tar.gz"
          tar -czf "$ARCHIVE" backup-*.sql SHA256SUMS
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$ARCHIVE" \
            -out "${ARCHIVE}.enc" \
            -pass env:BACKUP_ARCHIVE_PASSPHRASE
          test -s "${ARCHIVE}.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "${ARCHIVE}.enc" \
            -pass env:BACKUP_ARCHIVE_PASSPHRASE | tar -tzf - >/dev/null
          rm -f backup-*.sql SHA256SUMS "$ARCHIVE"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: database-backup-*.tar.gz.enc
          if-no-files-found: error
          retention-days: 14

  deploy-migrations:
    name: Deploy Migrations
    needs: [dry-run, backup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          supabase db push --linked

  deploy-functions:
    name: Deploy Edge Functions
    needs: deploy-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        function:
          - coach-chat
          - coach-decide
          - health-check
          - health-sync
          - meal-analyze
          - meal-media-retention
          - onboarding-propose-plan
          - privacy-delete-account
          - privacy-export
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Deploy ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          supabase functions deploy ${{ matrix.function }} --project-ref qsfzzsjenopqqqhvpyaw --use-api

  smoke-test:
    name: Smoke Test
    needs: deploy-functions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://qsfzzsjenopqqqhvpyaw.supabase.co/functions/v1/health-check)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (200)."
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying..."
            sleep 10
          done
          echo "::error::Health check failed after 3 attempts."
          exit 1

  tag-release:
    name: Tag Release
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create release tag
        run: |
          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Release tagged: $TAG"
