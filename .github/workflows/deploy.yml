name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-gate:
    name: Mandatory CI Gate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm successful main CI run
        run: |
          echo "CI run ${{ github.event.workflow_run.html_url }} passed."
          echo "Deploying exact commit ${{ github.event.workflow_run.head_sha }}."

  dry-run:
    name: Migration Dry-Run
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: "2.101.0"

      - name: Dry-run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          supabase db push --linked --dry-run

  backup:
    name: Backup + Isolated Restore Drill
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: "2.101.0"

      - name: Dump production schema + data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          TIMESTAMP=$(date -u +%Y-%m-%dT%H%M%S)
          echo "BACKUP_STAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          supabase db dump --linked --role-only -f "backup-${TIMESTAMP}-roles.sql"
          supabase db dump --linked -f "backup-${TIMESTAMP}-schema.sql"
          supabase db dump --linked --data-only --use-copy -f "backup-${TIMESTAMP}-data.sql"
          # The data dump leaves out supabase_migrations, so record which
          # migrations production has applied for the privilege comparison.
          supabase migration list --linked >"$RUNNER_TEMP/migration-list.txt"
          bash scripts/restore-privileges.sh versions "$RUNNER_TEMP/migration-list.txt" \
            >"$RUNNER_TEMP/applied-migrations.txt"

      - name: Verify backup integrity
        run: |
          for file in \
            "backup-${BACKUP_STAMP}-roles.sql" \
            "backup-${BACKUP_STAMP}-schema.sql" \
            "backup-${BACKUP_STAMP}-data.sql"; do
            test -s "$file" || {
              echo "::error::Backup is missing or empty: $file"
              exit 1
            }
          done
          sha256sum backup-*.sql > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Start isolated restore target
        run: |
          supabase start
          # `supabase start` applied every migration of this commit; keep its
          # privileges to compare with the restored database.
          bash scripts/restore-privileges.sh snapshot >"$RUNNER_TEMP/privileges-migrations.tsv"

      - name: Restore schema + data into isolated database
        run: |
          DB_CONTAINER=$(docker ps \
            --filter 'name=supabase_db_' \
            --format '{{.Names}}' | head -1)
          test -n "$DB_CONTAINER" || {
            echo "::error::Isolated Supabase database container was not found."
            exit 1
          }

          # On an error psql prints the failing statement, and for the data
          # file that statement holds production rows. The deploy log is
          # public, so restore output goes to a file that is always removed,
          # and a failure shows only the step and the failing line number.
          restore_psql() {
            local step="$1"
            shift
            local log
            log=$(mktemp)
            if docker exec "$DB_CONTAINER" psql --quiet \
              --variable VERBOSITY=terse --variable SHOW_CONTEXT=never \
              "$@" >"$log" 2>&1; then
              rm -f "$log"
              return 0
            fi
            local where
            where=$(grep -m1 -oE 'psql:/tmp/[a-z]+[.]sql:[0-9]+' "$log" || true)
            rm -f "$log"
            echo "::error::$step failed${where:+ at ${where#psql:}}. Output withheld: it can contain production rows."
            exit 1
          }

          # `public` and `private` belong to the local postgres role, while
          # Supabase-managed schemas contain tables that role cannot modify.
          # Clear each with its owning administrative role before replaying the
          # production snapshot. `private` must go too: the snapshot recreates it,
          # and its tables already exist here from the migrations `supabase start`
          # applied (first seen 2026-10-13, once production had private tables).
          # The new `public` gets the grants the old one had, as in a fresh
          # project; the snapshot then adds its own. A blanket GRANT ALL here
          # gave anon and authenticated CREATE on `public`, which no migration
          # grants (found by the privilege comparison, 2026-10-15).
          restore_psql "Reset public and private schemas" \
            --username postgres \
            --dbname postgres \
            --variable ON_ERROR_STOP=1 \
            --command "DO \$\$
              DECLARE
                schema_grants text[];
                schema_grant text;
              BEGIN
                SELECT coalesce(array_agg(format(
                  'GRANT %s ON SCHEMA public TO %s',
                  acl.privilege_type,
                  CASE WHEN acl.grantee = 0 THEN 'PUBLIC' ELSE quote_ident(role.rolname) END
                )), '{}')
                INTO schema_grants
                FROM pg_namespace AS namespace
                CROSS JOIN LATERAL aclexplode(namespace.nspacl) AS acl
                LEFT JOIN pg_roles AS role ON role.oid = acl.grantee
                WHERE namespace.nspname = 'public';

                DROP SCHEMA public CASCADE;
                CREATE SCHEMA public;
                FOREACH schema_grant IN ARRAY schema_grants LOOP
                  EXECUTE schema_grant;
                END LOOP;
              END
            \$\$;" \
            --command 'DROP SCHEMA IF EXISTS private CASCADE'

          restore_psql "Clear managed schemas" \
            --username supabase_admin \
            --dbname postgres \
            --variable ON_ERROR_STOP=1 \
            --command "DO \$\$
              DECLARE relation_list text;
              BEGIN
                SELECT string_agg(
                  format('%I.%I', namespace.nspname, class.relname),
                  ', ' ORDER BY namespace.nspname, class.relname
                )
                INTO relation_list
                FROM pg_class AS class
                JOIN pg_namespace AS namespace ON namespace.oid = class.relnamespace
                WHERE class.relkind IN ('r', 'p')
                  AND namespace.nspname IN (
                    'auth', 'realtime', 'storage', 'supabase_migrations', 'vault'
                  )
                  AND NOT EXISTS (
                    SELECT 1 FROM pg_inherits AS inheritance
                    WHERE inheritance.inhrelid = class.oid
                  );

                IF relation_list IS NOT NULL THEN
                  EXECUTE 'TRUNCATE TABLE ' || relation_list || ' RESTART IDENTITY CASCADE';
                END IF;
              END
            \$\$;"

          docker cp "backup-${BACKUP_STAMP}-schema.sql" "$DB_CONTAINER:/tmp/schema.sql"
          docker cp "backup-${BACKUP_STAMP}-data.sql" "$DB_CONTAINER:/tmp/data.sql"

          # The production schema is owned by postgres, but a few managed
          # storage tables only permit the internal admin to write their rows.
          restore_psql "Schema restore" \
            --username postgres \
            --dbname postgres \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file /tmp/schema.sql

          restore_psql "Data restore" \
            --username supabase_admin \
            --dbname postgres \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' \
            --file /tmp/data.sql

          TABLE_COUNT=$(docker exec "$DB_CONTAINER" psql \
            --username postgres \
            --dbname postgres \
            --tuples-only \
            --no-align \
            --command "select count(*) from pg_tables where schemaname = 'public'" | tr -d '[:space:]')
          test "${TABLE_COUNT:-0}" -gt 0 || {
            echo "::error::Restore drill produced no public tables."
            exit 1
          }
          echo "Restore drill passed with $TABLE_COUNT public tables."

      - name: Encrypt verified backup artifact
        env:
          BACKUP_ARCHIVE_PASSPHRASE: ${{ secrets.BACKUP_ARCHIVE_PASSPHRASE }}
        run: |
          test -n "$BACKUP_ARCHIVE_PASSPHRASE" || {
            echo "::error::BACKUP_ARCHIVE_PASSPHRASE is not configured."
            exit 1
          }
          ARCHIVE="database-backup-${BACKUP_STAMP}.tar.gz"
          tar -czf "$ARCHIVE" backup-*.sql SHA256SUMS
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$ARCHIVE" \
            -out "${ARCHIVE}.enc" \
            -pass env:BACKUP_ARCHIVE_PASSPHRASE
          test -s "${ARCHIVE}.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "${ARCHIVE}.enc" \
            -pass env:BACKUP_ARCHIVE_PASSPHRASE | tar -tzf - >/dev/null
          rm -f backup-*.sql SHA256SUMS "$ARCHIVE"

      - name: Store encrypted backup in the private backups repository
        env:
          BACKUP_REPO: ${{ vars.BACKUP_REPO }}
          BACKUP_REPO_DEPLOY_KEY: ${{ secrets.BACKUP_REPO_DEPLOY_KEY }}
        run: |
          test -n "$BACKUP_REPO" && test -n "$BACKUP_REPO_DEPLOY_KEY" || {
            echo "::error::The BACKUP_REPO variable and BACKUP_REPO_DEPLOY_KEY secret must be configured."
            exit 1
          }
          bash scripts/store-backup.sh "database-backup-${BACKUP_STAMP}.tar.gz.enc"

      # `supabase db dump` drops GRANT and REVOKE lines that name a schema it
      # excludes (auth, extensions, vault, ...), so a restore can silently give
      # anon EXECUTE on a function the migrations revoked. This runs after the
      # backup is stored: the backup is still useful, but the deploy stops.
      # Output names objects only. When this commit adds migrations, the script
      # resets the drill database to production's version for the comparison.
      - name: Compare restored privileges with the migrations
        run: |
          bash scripts/restore-privileges.sh compare \
            "$RUNNER_TEMP/privileges-migrations.tsv" \
            "$RUNNER_TEMP/applied-migrations.txt"

  deploy-migrations:
    name: Deploy Migrations
    needs: [dry-run, backup]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: "2.101.0"

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          supabase db push --linked

      # The research library's embedding job posts only where this Vault secret
      # exists, so local and CI databases stay inert. Idempotent; Vault is not
      # part of a restore, so every deploy sets it again.
      - name: Point the library embedder at production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db query --linked \
            "select private.library_set_embed_url('https://qsfzzsjenopqqqhvpyaw.supabase.co/functions/v1/library-embed');"

      # The daily retention job posts only where this Vault secret exists (and the Vault secret
      # retention_worker_secret, set by hand). Idempotent; Vault is not part of a restore.
      - name: Point the meal-media retention job at production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db query --linked \
            "select private.meal_media_retention_set_url('https://qsfzzsjenopqqqhvpyaw.supabase.co/functions/v1/meal-media-retention');"

  deploy-functions:
    name: Deploy Edge Functions
    needs: deploy-migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # One at a time. On 2026-09-28 Supabase reported success for all nine
      # parallel deploys but kept the previous version of four of them.
      max-parallel: 1
      matrix:
        function:
          - coach-chat
          - coach-decide
          - health-check
          - health-sync
          - library-embed
          - meal-analyze
          - meal-media-retention
          - onboarding-plan
          - onboarding-propose-plan
          - physique-check
          - privacy-delete-account
          - privacy-export
          - waitlist-confirm
          - waitlist-join
          - waitlist-unsubscribe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: "2.101.0"

      - name: Deploy ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CLI: supabase
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          # Retries Supabase's intermittent "unexpected deploy status 500".
          scripts/deploy-function.sh ${{ matrix.function }}

      - name: Confirm ${{ matrix.function }} is live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CLI: supabase
        run: |
          if scripts/verify-live-function.sh ${{ matrix.function }}; then
            exit 0
          fi
          echo "::warning::${{ matrix.function }} was reported deployed but is not live. Deploying once more."
          scripts/deploy-function.sh ${{ matrix.function }}
          scripts/verify-live-function.sh ${{ matrix.function }}

  verify-functions:
    name: Verify Live Functions
    needs: deploy-functions
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: "2.101.0"

      - name: Every function runs this commit's code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CLI: supabase
          VERIFY_ATTEMPTS: "3"
        run: |
          # Checks every function directory in the commit, so a function missing
          # from the deploy matrix fails here too.
          scripts/verify-live-function.sh --all

  # The research library is usable: every chunk has its embedding (new or changed chunks are
  # embedded by the library-embed cron job, about a dozen a minute, so this waits for them) and a
  # sample search returns rows. Read-only: two SELECTs through the Management API.
  library-check:
    name: Library Check
    needs: deploy-functions
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: "2.101.0"

      - name: Every chunk is embedded and the search returns rows
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          # Each query returns one tagged value, read the same way whatever the output format.
          value() { supabase db query --linked "$1" | grep -oE "$2" | head -n 1; }
          for attempt in $(seq 1 40); do
            status=$(value "select 'status:' || (s ->> 'chunks') || ':' || (s ->> 'embedded_chunks') from public.library_status_v1() s" 'status:[0-9]+:[0-9]+' || true)
            chunks=$(printf '%s' "$status" | cut -d: -f2)
            embedded=$(printf '%s' "$status" | cut -d: -f3)
            echo "Attempt $attempt: ${embedded:-?} of ${chunks:-?} chunks embedded"
            if [ -n "$chunks" ] && [ "$chunks" -gt 0 ] && [ "$chunks" = "$embedded" ]; then
              rows=$(value "select 'rows:' || count(*) from public.search_library_v3('protein per day', null, null, 3, null)" 'rows:[0-9]+' | cut -d: -f2)
              if [ "${rows:-0}" -gt 0 ]; then
                echo "A sample search returned $rows rows."
                exit 0
              fi
              echo "::error::Every chunk is embedded but a sample search returned no rows."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Library chunks are still not all embedded after 20 minutes. Check library-embed's logs and private.library_ingest_runs."
          exit 1

  smoke-test:
    name: Smoke Test
    needs: deploy-functions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://qsfzzsjenopqqqhvpyaw.supabase.co/functions/v1/health-check)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (200)."
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying..."
            sleep 10
          done
          echo "::error::Health check failed after 3 attempts."
          exit 1

  website:
    name: Website
    needs: [smoke-test, verify-functions]
    uses: ./.github/workflows/site-deploy.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  tag-release:
    name: Tag Release
    needs: [smoke-test, verify-functions, website, library-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create release tag
        run: |
          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Release tagged: $TAG"
