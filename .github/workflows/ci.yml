name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main, feature/**]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deno:
    name: Deno (fmt + lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            supabase/functions/_shared/.deno-cache
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/_shared/deps.ts', 'supabase/functions/**/deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint supabase/functions

      - name: Unit tests (no DB)
        run: deno test --allow-env --allow-net --allow-read=supabase/migrations,site/src/config.ts supabase/functions

      - name: Backup storage script tests
        run: bash scripts/test-store-backup.sh

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unit + widget tests
        run: flutter test

  flutter-build:
    name: Flutter iOS Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: iOS release build (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name "$(./scripts/app-version.sh name)" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify app bundle assets
        run: ./scripts/verify-app-bundle.sh build/ios/iphoneos/Runner.app

  pgtap:
    name: pgTAP (fresh DB + migrations + parity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: "2.101.0"

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply all migrations on a fresh database
        run: supabase db reset

      - name: Install pgTAP command-line harness
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            postgresql-client \
            libtap-parser-sourcehandler-pgtap-perl
          test ! -e /fixtures || {
            echo '::error::Unexpected pre-existing /fixtures path on the clean runner.'
            exit 1
          }
          sudo ln --symbolic "$PWD/test/reference/fixtures" /fixtures
          pg_prove --version

      - name: Run pgTAP suite (incl. 223-assertion reference parity oracle)
        env:
          PGPASSWORD: postgres
        run: >-
          pg_prove -h 127.0.0.1 -p 54322 -U postgres -d postgres
          supabase/tests/database/*_test.sql

  website:
    name: Website Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install (build dependencies only)
        working-directory: site
        run: npm ci --omit=dev

      - name: Build every page
        working-directory: site
        env:
          # Cloudflare's published Turnstile test key and placeholder addresses:
          # this job proves the site builds; site-deploy.yml builds with real values.
          PUBLIC_WAITLIST_API: https://qsfzzsjenopqqqhvpyaw.supabase.co/functions/v1
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          PUBLIC_CONTACT_EMAIL: hello@tracend.test
          PUBLIC_SITE_URL: https://tracend.pages.dev
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          for page in index privacy/index terms/index confirm/index unsubscribe/index 404; do
            test -s "dist/$page.html" || { echo "::error::Missing dist/$page.html"; exit 1; }
          done

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: gitleaks scans every commit

      - name: Install pinned gitleaks binary
        run: |
          VERSION=8.30.1
          EXPECTED_SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${EXPECTED_SHA}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history for secrets
        run: gitleaks git --verbose .

  migration-check:
    name: Migration Collision Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check for duplicate migration timestamps
        run: |
          DUPES=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -exec basename {} \; | grep -oP '^\d+' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate migration timestamps found: $DUPES"
            echo "Run: ls supabase/migrations/ | sort"
            exit 1
          fi
          echo "No duplicate migration timestamps found."

      - name: Migration order check tests
        run: bash scripts/test-check-migration-order.sh

      - name: Check new migrations are newer than the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          ./scripts/check-migration-order.sh "origin/${BASE_REF}"

      - name: Validate release version metadata
        run: |
          ./scripts/app-version.sh name
          ./scripts/app-version.sh number
