name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main, feature/**]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    name: Deno (fmt + lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            supabase/functions/_shared/.deno-cache
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/_shared/deps.ts', 'supabase/functions/**/deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint supabase/functions

      - name: Unit tests (no DB)
        run: deno test --allow-env --allow-net supabase/functions

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unit + widget tests
        run: flutter test

  flutter-build:
    name: Flutter iOS Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: iOS release build (no codesign)
        run: flutter build ios --release --no-codesign

  migration-check:
    name: Migration Collision Check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate migration timestamps
        run: |
          DUPES=$(ls supabase/migrations/*.sql 2>/dev/null | sed 's|.*/||' | grep -oP '^\d+' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate migration timestamps found: $DUPES"
            echo "Run: ls supabase/migrations/ | sort"
            exit 1
          fi
          echo "No duplicate migration timestamps found."
