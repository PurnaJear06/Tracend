name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main, feature/**]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    name: Deno (fmt + lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            supabase/functions/_shared/.deno-cache
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/_shared/deps.ts', 'supabase/functions/**/deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint supabase/functions

      - name: Unit tests (no DB)
        run: deno test --allow-env --allow-net supabase/functions

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

  flutter-test:
    name: Flutter Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unit + widget tests
        run: flutter test

  flutter-build:
    name: Flutter iOS Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: iOS release build (no codesign)
        run: flutter build ios --release --no-codesign

  pgtap:
    name: pgTAP (fresh DB + migrations + parity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply all migrations on a fresh database
        run: supabase db reset

      - name: Run pgTAP suite (incl. 223-assertion reference parity oracle)
        run: |
          docker run --rm \
            --network container:supabase_db_Tracend \
            --env PGPASSWORD=postgres \
            --volume "$PWD/supabase/tests/database:/tests:ro" \
            --volume "$PWD/test/reference/fixtures:/fixtures:ro" \
            public.ecr.aws/supabase/pg_prove:3.36 \
            sh -lc 'pg_prove -h 127.0.0.1 -U postgres -d postgres /tests/*_test.sql'

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: gitleaks scans every commit

      - name: Install pinned gitleaks binary
        run: |
          VERSION=8.30.1
          EXPECTED_SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${EXPECTED_SHA}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history for secrets
        run: gitleaks git --verbose .

  migration-check:
    name: Migration Collision Check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate migration timestamps
        run: |
          DUPES=$(ls supabase/migrations/*.sql 2>/dev/null | sed 's|.*/||' | grep -oP '^\d+' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate migration timestamps found: $DUPES"
            echo "Run: ls supabase/migrations/ | sort"
            exit 1
          fi
          echo "No duplicate migration timestamps found."
