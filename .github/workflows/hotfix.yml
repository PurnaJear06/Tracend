name: Hotfix Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dry-run:
    name: Migration Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Dry-run migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          supabase db push --linked --dry-run

  deploy-migrations:
    name: Deploy Migrations
    needs: dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          supabase db push --linked

  deploy-functions:
    name: Deploy Edge Functions
    needs: deploy-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # One at a time. On 2026-09-28 Supabase reported success for all nine
      # parallel deploys but kept the previous version of four of them.
      max-parallel: 1
      matrix:
        function:
          - coach-chat
          - coach-decide
          - health-check
          - health-sync
          - meal-analyze
          - meal-media-retention
          - onboarding-plan
          - onboarding-propose-plan
          - physique-check
          - privacy-delete-account
          - privacy-export
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Deploy ${{ matrix.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CLI: supabase
        run: |
          supabase link --project-ref qsfzzsjenopqqqhvpyaw
          # Retries Supabase's intermittent "unexpected deploy status 500".
          scripts/deploy-function.sh ${{ matrix.function }}

      - name: Confirm ${{ matrix.function }} is live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CLI: supabase
        run: |
          if scripts/verify-live-function.sh ${{ matrix.function }}; then
            exit 0
          fi
          echo "::warning::${{ matrix.function }} was reported deployed but is not live. Deploying once more."
          scripts/deploy-function.sh ${{ matrix.function }}
          scripts/verify-live-function.sh ${{ matrix.function }}

  verify-functions:
    name: Verify Live Functions
    needs: deploy-functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2
        with:
          version: "2.101.0"

      - name: Every function runs this commit's code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_CLI: supabase
          VERIFY_ATTEMPTS: "3"
        run: |
          # Checks every function directory in the commit, so a function missing
          # from the deploy matrix fails here too.
          scripts/verify-live-function.sh --all

  smoke-test:
    name: Smoke Test
    needs: deploy-functions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://qsfzzsjenopqqqhvpyaw.supabase.co/functions/v1/health-check)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (200)."
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying..."
            sleep 10
          done
          echo "::error::Health check failed after 3 attempts."
          exit 1

  tag-release:
    name: Tag Release
    needs: [smoke-test, verify-functions]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release tag
        run: |
          TAG="hf-v$(date -u +%Y.%m.%d-%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Hotfix tagged: $TAG"
